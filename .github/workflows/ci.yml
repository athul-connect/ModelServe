name: ModelServe CI

on:
  push:
  pull_request:

jobs:
  test:
    run-on: ubuntu-latest


    steps:
      - name: checkout respository
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirments.txt

      - name: Run tests
        run: pytest -v
